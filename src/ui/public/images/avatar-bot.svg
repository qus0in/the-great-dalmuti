<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
  <!-- Colors: cream (#FDF4D2), sky (#B0CDE6), dark ink (#191211), rose (#946D6D). -->
  <defs>
    <clipPath id="avatar-bot-clip">
      <circle cx="32" cy="32" r="32" />
    </clipPath>
  </defs>
  <circle cx="32" cy="32" r="32" fill="#FDF4D2" />
  <g clip-path="url(#avatar-bot-clip)">
    <!-- Antenna -->
    <line x1="32" y1="12" x2="32" y2="18" stroke="#191211" stroke-width="3" stroke-linecap="round" />
    <circle cx="32" cy="11" r="3" fill="#946D6D" />
    <!-- Ears -->
    <rect x="14" y="27" width="4" height="8" rx="2" fill="#946D6D" />
    <rect x="46" y="27" width="4" height="8" rx="2" fill="#946D6D" />
    <!-- Head -->
    <rect x="18" y="19" width="28" height="24" rx="5" fill="#191211" />
    <!-- Eyes -->
    <circle cx="26" cy="29" r="3" fill="#B0CDE6" />
    <circle cx="38" cy="29" r="3" fill="#B0CDE6" />
    <!-- Mouth -->
    <line x1="26" y1="37" x2="38" y2="37" stroke="#B0CDE6" stroke-width="2" stroke-linecap="round" />
    <!-- Neck and Shoulders -->
    <rect x="28" y="43" width="8" height="5" fill="#191211" />
    <path d="M16 60 C16 51 23 48 32 48 C41 48 48 51 48 60 Z" fill="#191211" />
  </g>
</svg>
