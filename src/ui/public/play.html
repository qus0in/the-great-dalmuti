  <link rel="stylesheet" href="css/components/panel.css">

  <link rel="stylesheet" href="css/play/hud-mobile.css">
  <link rel="stylesheet" href="css/play/banner.css">
  <link rel="stylesheet" href="css/play/arena.css">
  <link rel="stylesheet" href="css/play/arena-mobile.css">
  <link rel="stylesheet" href="css/play/card-stack.css">
  <link rel="stylesheet" href="css/play/table-felt-details.css">
  <link rel="stylesheet" href="css/play/table-felt.css">
  <link rel="stylesheet" href="css/play/hand.css">
  <link rel="stylesheet" href="css/play/hand-fan-deal.css">
  <link rel="stylesheet" href="css/play/hand-mobile.css">

<body class="play-page" data-page="play">
  <div class="play-container">

    <!-- 1. Header HUD & Round Information Bar -->
    <header class="play-hud" aria-label="게임 상태 정보" data-play="hud">
      <div class="play-hud__left">
        <h1 class="play-hud__brand"><a href="/">The Great Dalmuti</a></h1>
        <div class="play-hud__round" data-play="round">
          <span class="badge">대기 중</span>
        </div>
        <div class="play-hud__tribute" data-play="tribute" hidden></div>
      </div>
      <div class="play-hud__right">
        <div class="play-hud__deck-stat cluster cluster--sm" data-play="deck-stat" hidden></div>
        <a href="/" class="play-hud__exit-link">로비로 나가기</a>
      </div>
    </header>

    <!-- 2. Action Banner -->
    <section class="play-action-banner" aria-label="최근 플레이 안내" data-play="banner">
      <h2 class="sr-only">최근 플레이 안내</h2>
      게임을 불러오는 중…
    </section>
    <p class="play-action-banner" data-play="substitution" role="status" hidden></p>

    <!-- 3. Card Room Arena (4 Seats + Felt Game Table) -->
    <main class="play-arena" aria-label="달무티 게임 대전 화면">
      <h2 class="sr-only">게임 대전 공간</h2>

      <!-- North Seat -->
      <section class="play-arena__seat--north" aria-label="북쪽 좌석 정보">
        <h3 class="sr-only">북쪽 좌석</h3>
        <div class="seat" data-play="seat" data-seat="0">
          <div class="seat__avatar">
            <span class="avatar avatar--sm">
              <img class="avatar__img" src="/images/avatar-silhouette.svg" alt="대기 중 프로필" width="36" height="36">
            </span>
          </div>
          <div class="seat__content">
            <div class="seat__name-row">
              <span class="seat__name">대기 중</span>
              <span class="badge" data-play="seat-rank" hidden></span>
            </div>
            <div class="seat__status-row">
              <span class="seat__status" data-play="seat-status">대기 중</span>
              <div class="card-stack" aria-hidden="true"></div>
              <span class="seat__count">0장</span>
            </div>
          </div>
        </div>
      </section>

      <!-- West Seat -->
      <section class="play-arena__seat--west" aria-label="서쪽 좌석 정보">
        <h3 class="sr-only">서쪽 좌석</h3>
        <div class="seat" data-play="seat" data-seat="3">
          <div class="seat__avatar">
            <span class="avatar avatar--sm">
              <img class="avatar__img" src="/images/avatar-silhouette.svg" alt="대기 중 프로필" width="36" height="36">
            </span>
          </div>
          <div class="seat__content">
            <div class="seat__name-row">
              <span class="seat__name">대기 중</span>
              <span class="badge" data-play="seat-rank" hidden></span>
            </div>
            <div class="seat__status-row">
              <span class="seat__status" data-play="seat-status">대기 중</span>
              <div class="card-stack" aria-hidden="true"></div>
              <span class="seat__count">0장</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Center Game Table Surface (.table-felt) -->
      <section class="play-arena__table table-felt" aria-label="게임 테이블 필드">
        <h3 class="sr-only">게임 테이블 필드</h3>
        <div class="table-felt__status">
          <span class="table-felt__status-label">현재 트릭</span>
          <span class="table-felt__status-target" data-play="trick-target">대기 중</span>
        </div>

        <!-- Played Trick Cards on Table -->
        <div class="table-felt__trick" aria-label="현재 필드에 나온 카드" data-play="trick"></div>

        <div class="table-felt__discard-ghost" data-play="previous-trick" hidden></div>
      </section>

      <!-- East Seat -->
      <section class="play-arena__seat--east" aria-label="동쪽 좌석 정보">
        <h3 class="sr-only">동쪽 좌석</h3>
        <div class="seat" data-play="seat" data-seat="1">
          <div class="seat__avatar">
            <span class="avatar avatar--sm">
              <img class="avatar__img" src="/images/avatar-silhouette.svg" alt="대기 중 프로필" width="36" height="36">
            </span>
          </div>
          <div class="seat__content">
            <div class="seat__name-row">
              <span class="seat__name">대기 중</span>
              <span class="badge" data-play="seat-rank" hidden></span>
            </div>
            <div class="seat__status-row">
              <span class="seat__status" data-play="seat-status">대기 중</span>
              <div class="card-stack" aria-hidden="true"></div>
              <span class="seat__count">0장</span>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- 4. Player Hand Area (South / 나) -->
    <footer class="play-hand-area" aria-label="내 손패 및 조작 패널">
      <h2 class="sr-only">내 손패 및 게임 조작</h2>
      <div class="play-hand-header">
        <div class="play-hand-header__meta">
          <div class="seat seat--me" data-play="seat" data-seat="2">
            <h3 class="sr-only">내 정보 및 상태</h3>
            <div class="seat__avatar">
              <span class="avatar avatar--sm">
                <img class="avatar__img" src="/images/avatar-silhouette.svg" alt="대기 중 프로필" width="36" height="36">
              </span>
            </div>
            <div class="seat__content">
              <div class="seat__name-row">
                <span class="play-hand-header__title">대기 중</span>
                <span class="badge" data-play="seat-rank" hidden></span>
              </div>
              <div class="seat__status-row">
                <span class="seat__status" data-play="seat-status">대기 중</span>
                <span class="seat__count">남은 카드 0장</span>
              </div>
            </div>
          </div>
          <span class="play-hand-header__selection-hint" data-play="selection-hint" hidden></span>
          <div id="play-hint" class="play-hand-header__selection-hint" data-play="hint" aria-live="polite" hidden></div>
        </div>

        <div class="play-hand-controls">
          <button type="button" class="btn btn--gold" data-play="submit" disabled>카드 내기</button>
          <button type="button" class="btn btn--secondary" data-play="pass" disabled>패스(Pass)</button>
        </div>
        <div class="sr-only" aria-live="polite" data-play="message"></div>
      </div>

      <!-- Fanned Hand Cards -->
      <div class="hand-tray" aria-label="내 카드 목록">
        <div class="hand-fan" data-play="hand"></div>
      </div>
    </footer>

  </div>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/play.js"></script>
</body>
</html>
