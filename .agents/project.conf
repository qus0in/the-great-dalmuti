# .agents/project.conf — project-specific values for generic skill scripts.
# Sourced with `.` by .agents/skills/{codify,layers,orchestrate}/scripts/*; POSIX KEY=VALUE only, no logic.
# Empty file or missing keys -> generic defaults (exemptions off, checks skipped). Repo-root-relative paths.

# codify/scripts/lines.sh: file globs exempt from the 100-line gate (space-separated, matched with `set -f`).
LINES_EXEMPT_PATTERNS='dist/*.html src/ui/public/*.html'
LINES_EXEMPT_BASIS='Temporary until 0.3 SSR splits them into template partials (issue #19/#20)'

# layers/scripts/check.sh: layer names, allowed import pairs (from:to), files allowed outside layers.
LAYERS='ui app domain infra'
LAYER_DEPS='ui:ui ui:app app:app app:domain infra:infra infra:app infra:domain domain:domain'
LAYER_OUTSIDE='main.js'
# main.js (composition root, wires infra+ui) sits outside layers per 0.3 structure map: src/main.js,
# docs/structure.md (layer layout map), ADR-0007. The old "Decision 60" citation is lost repo-wide;
# ADR-0007 + docs/structure.md are the canonical source.

# orchestrate/scripts/verify.sh: ui gate target dir (empty = ui gate skipped).
UI_CHECK_TARGET='src/ui/public'
